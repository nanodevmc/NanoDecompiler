name: build-and-release

# Автоматический запуск НА КАЖДЫЙ push в main - ничего руками включать не
# нужно. workflow_dispatch оставлен ДОПОЛНИТЕЛЬНО - просто кнопка "запустить
# вручную" из вкладки Actions, если что-то упало и нужно повторить без
# нового push.
#
# ОДИН общий релиз (не два раздельных, как было раньше) - собирает и клиент,
# и оба API-exe, публикует всё разом с текстовым описанием в теле релиза.
# Механика: build-client и build-api ТОЛЬКО собирают и складывают свои файлы
# в build-артефакты (actions/upload-artifact) - релиз не публикуют. Третий
# job (publish-release) ждёт оба (`needs:`), скачивает оба набора файлов
# (actions/download-artifact) и публикует их ОДНИМ релизом через
# softprops/action-gh-release. Если один из двух build-job'ов упадёт -
# publish-release не запустится вообще (весь релиз атомарный: либо оба
# продукта собрались и опубликовались, либо не публикуется ничего).
#
# Тег релиза - статический (берётся из package.json, см. resolve-version
# ниже). При повторном push softprops/action-gh-release сам обновит
# существующий релиз новыми файлами вместо создания дубликата - когда
# версию нужно поднять, меняешь ТОЛЬКО "version" в package.json (единый
# источник правды - см. HANDOFF по версионированию v1.4.1), ничего в этом
# workflow трогать не нужно.

# ПРИМЕЧАНИЕ про npm install vs npm ci: в проекте нет package-lock.json
# (собирался package.json вручную, без сети для реального npm install) -
# поэтому сборка использует `npm install`, а не `npm ci`. Как только у
# кого-то локально с интернетом получится один раз выполнить `npm install`
# и закоммитить получившийся package-lock.json в репозиторий - можно (и
# стоит) вернуть здесь `npm ci` обратно: она детерминированная (ставит
# ровно то, что в локе, без пересчёта дерева зависимостей) и быстрее.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Принцип наименьших привилегий: сборочные job'ы запускают npm install /
# компиляцию чужих зависимостей и НЕ должны иметь права записи в репозиторий.
# Право contents: write выдано только job'у publish-release (см. ниже) -
# ему оно нужно для softprops/action-gh-release (создать/обновить релиз).
permissions:
  contents: read

jobs:
  resolve-version:
    # Единственное место, где версия читается из файла - package.json
    # ("version" в корне) - ЕДИНСТВЕННЫЙ источник правды для всего
    # релиза (тег, версия клиента, версия API/CLI-exe). Раньше это было
    # трижды продублировано прямо в env: этого workflow (RELEASE_TAG/
    # CLIENT_VERSION/API_VERSION) и НЕЗАВИСИМО от package.json - легко
    # было забыть поднять что-то одно из трёх. Теперь поднимаешь версию
    # в package.json - и она подтягивается сюда, и в собранный
    # electron-builder-инсталлятор (он тоже читает package.json
    # нативно), и в CLIENT_VERSION/API_VERSION ниже.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Прочитать версию из package.json
        id: get_version
        run: |
          # Соглашение о номерах версий проекта: релиз - РОВНО два числа
          # (1.4, 1.5, 1.6...), БЕЗ хвостового нуля. Пререлиз/бета - три
          # и больше чисел (1.4.1, 1.4.2...). package.json обязан быть
          # валидным semver (major.minor.patch, все три числа) - поэтому
          # релизы там хранятся как "1.6.0" и здесь патч-нуль ОТРЕЗАЕТСЯ
          # для тега/отображения; если патч не ноль (напр. "1.6.1") -
          # это бета, показываем как есть, с патчем.
          VERSION=$(node -p "require('./package.json').version")
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          if [ "$PATCH" = "0" ]; then
            DISPLAY=$(echo "$VERSION" | cut -d. -f1,2)
          else
            DISPLAY="$VERSION"
          fi
          echo "version=v$DISPLAY" >> "$GITHUB_OUTPUT"

  build-client-windows:
    needs: [resolve-version, build-clapi-windows]
    runs-on: windows-latest
    env:
      API_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Скачать собранный движок ClApi (Windows)
        uses: actions/download-artifact@v4
        with:
          name: clapi-artifacts-windows
          path: resources/engine

      - name: Подготовить NanoDecompilerCLI.exe и проверить целостность
        shell: bash
        run: |
          if [ -f "resources/engine/NanoDecompilerClApi.exe" ]; then
            mv "resources/engine/NanoDecompilerClApi.exe" "resources/engine/NanoDecompilerCLI.exe"
          fi
          if [ ! -f "resources/engine/NanoDecompilerCLI.exe" ]; then
            echo "::error::NanoDecompilerCLI.exe не найден после скачивания артефакта!"
            exit 1
          fi
          SIZE=$(wc -c < "resources/engine/NanoDecompilerCLI.exe")
          echo "Размер бинарника: $SIZE байт"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Бинарник NanoDecompilerCLI.exe подозрительно маленький (< 1MB)!"
            exit 1
          fi

      - name: Записать .engine-api-version (см. electron/updater.ts)
        shell: bash
        working-directory: resources/engine
        run: printf '%s' "$API_VERSION" > .engine-api-version

      - name: Проверка - собранный движок реально работает (смоук-тест, реальный плагин, флаги)
        shell: bash
        run: |
          echo "=== 1. Проверка флага --check-update ==="
          resources/engine/NanoDecompilerCLI.exe --check-update || true

          echo "=== 2. Смоук-тест декомпиляции ==="
          resources/engine/NanoDecompilerCLI.exe test_jars/smoketest_plugin.jar out_check_client_cli --no-legitimacy-check
          if [ ! -d "out_check_client_cli" ]; then echo "движок: out_dir не создан"; exit 1; fi

          echo "=== 3. Декомпиляция реального плагина BukkitOfUtils ==="
          resources/engine/NanoDecompilerCLI.exe test_jars/large_legit/BukkitOfUtils-1_19_0.jar out_check_bukkit_utils --no-legitimacy-check
          if [ ! -d "out_check_bukkit_utils" ]; then echo "движок: out_check_bukkit_utils не создан"; exit 1; fi

          echo "=== 4. Декомпиляция плагина скупщика NeoBuyer ==="
          resources/engine/NanoDecompilerCLI.exe test_jars/NeoBuyer.jar out_check_neobuyer --no-legitimacy-check
          if [ ! -d "out_check_neobuyer" ]; then echo "движок: out_check_neobuyer не создан"; exit 1; fi

          echo "=== 5. Тестирование плагинов автора (NanoForge, GlowCases, NanoMarket, NanoCore) ==="
          resources/engine/NanoDecompilerCLI.exe test_jars/user_plugins/NanoForge-1.6.1.jar out_user_nanoforge --no-legitimacy-check
          if [ ! -d "out_user_nanoforge" ]; then echo "движок: out_user_nanoforge не создан"; exit 1; fi
          resources/engine/NanoDecompilerCLI.exe test_jars/user_plugins/GlowCases-1.1.0.jar out_user_glowcases --no-legitimacy-check
          if [ ! -d "out_user_glowcases" ]; then echo "движок: out_user_glowcases не создан"; exit 1; fi
          resources/engine/NanoDecompilerCLI.exe test_jars/user_plugins/NanoMarket-2.0.0.jar out_user_nanomarket --no-legitimacy-check
          if [ ! -d "out_user_nanomarket" ]; then echo "движок: out_user_nanomarket не создан"; exit 1; fi
          resources/engine/NanoDecompilerCLI.exe test_jars/user_plugins/NanoCore.jar out_user_nanocore --no-legitimacy-check
          if [ ! -d "out_user_nanocore" ]; then echo "движок: out_user_nanocore не создан"; exit 1; fi

          echo "=== 6. Расширенные тесты плагинов (NanoRTP, NanoSpec, FunnyClans, HeadDatabase, MSG) ==="
          if [ -f "test_jars/NanoRTP.jar" ]; then resources/engine/NanoDecompilerCLI.exe test_jars/NanoRTP.jar out_test_nanortp --no-legitimacy-check; fi
          if [ -f "test_jars/NanoSpec-1_16_5.jar" ]; then resources/engine/NanoDecompilerCLI.exe test_jars/NanoSpec-1_16_5.jar out_test_nanospec --no-legitimacy-check; fi
          if [ -f "test_jars/FunnyClans-3_9.jar" ]; then resources/engine/NanoDecompilerCLI.exe test_jars/FunnyClans-3_9.jar out_test_funnyclans --no-legitimacy-check; fi
          if [ -f "test_jars/HeadDatabase-4_21_2.jar" ]; then resources/engine/NanoDecompilerCLI.exe test_jars/HeadDatabase-4_21_2.jar out_test_hdb --no-legitimacy-check; fi
          if [ -f "test_jars/MSG.jar" ]; then resources/engine/NanoDecompilerCLI.exe test_jars/MSG.jar out_test_msg --no-legitimacy-check; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Подготовить хэш зависимостей
        shell: bash
        run: |
          node -e 'const p = require("./package.json"); console.log(JSON.stringify({d: p.dependencies, dd: p.devDependencies}))' > .deps-hash.json

      - name: Кэш node_modules (ускоряет CI - см. HANDOFF)
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('.deps-hash.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Кэш Electron и electron-builder (Windows)
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: npm install
        run: npm install


      - name: Кэш Vite dist/ (фронтенд)
        uses: actions/cache@v4
        with:
          path: dist
          key: vite-dist-${{ hashFiles('src/**', 'index.html', 'vite.config.mts', 'tsconfig.json') }}
          restore-keys: |
            vite-dist-

      - name: Собрать Electron-инсталлятор (npm run dist)
        run: npm run dist

      - name: Найти собранный инсталлятор
        shell: bash
        run: |
          FILE=$(find dist -maxdepth 1 -iname "*.exe" ! -iname "elevate.exe" | grep -i "setup" | head -1)
          [ -z "$FILE" ] && FILE=$(find dist -iname "*.exe" ! -path "*win-unpacked*" ! -iname "elevate.exe" | head -1)
          if [ -z "$FILE" ]; then echo "Собранный .exe инсталлятора не найден - смотри логи electron-builder выше"; exit 1; fi
          cp "$FILE" "NanoDecompiler-Client-Setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: client-artifact-win
          path: NanoDecompiler-Client-Setup.exe
          if-no-files-found: error

  build-client-linux:
    needs: [resolve-version, build-clapi-linux]
    runs-on: ubuntu-latest
    env:
      API_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Скачать собранный движок ClApi (Linux)
        uses: actions/download-artifact@v4
        with:
          name: clapi-artifacts-linux
          path: resources/engine

      - name: Подготовить NanoDecompilerCLI и проверить целостность
        run: |
          if [ -f "resources/engine/NanoDecompilerClApi" ]; then
            mv "resources/engine/NanoDecompilerClApi" "resources/engine/NanoDecompilerCLI"
          fi
          if [ ! -f "resources/engine/NanoDecompilerCLI" ]; then
            echo "::error::NanoDecompilerCLI не найден после скачивания артефакта!"
            exit 1
          fi
          chmod +x resources/engine/NanoDecompilerCLI
          SIZE=$(wc -c < "resources/engine/NanoDecompilerCLI")
          echo "Размер бинарника: $SIZE байт"
          if [ "$SIZE" -lt 500000 ]; then
            echo "::error::Бинарник NanoDecompilerCLI подозрительно маленький (< 500KB)!"
            exit 1
          fi

      - name: Записать .engine-api-version (см. electron/updater.ts)
        working-directory: resources/engine
        run: printf '%s' "$API_VERSION" > .engine-api-version

      - name: Проверка - собранный движок реально работает (смоук-тест, реальный плагин, флаги)
        run: |
          echo "=== 1. Проверка флага --check-update ==="
          resources/engine/NanoDecompilerCLI --check-update || true

          echo "=== 2. Смоук-тест ==="
          resources/engine/NanoDecompilerCLI test_jars/smoketest_plugin.jar out_check_client_cli --no-legitimacy-check
          if [ ! -d "out_check_client_cli" ]; then echo "движок: out_dir не создан"; exit 1; fi

          echo "=== 3. Декомпиляция реального плагина BukkitOfUtils ==="
          resources/engine/NanoDecompilerCLI test_jars/large_legit/BukkitOfUtils-1_19_0.jar out_check_bukkit_utils --no-legitimacy-check
          if [ ! -d "out_check_bukkit_utils" ]; then echo "движок: out_check_bukkit_utils не создан"; exit 1; fi

          echo "=== 4. Тестирование плагинов автора (NanoForge, GlowCases, NanoMarket, NanoCore) ==="
          resources/engine/NanoDecompilerCLI test_jars/user_plugins/NanoForge-1.6.1.jar out_user_nanoforge --no-legitimacy-check
          if [ ! -d "out_user_nanoforge" ]; then echo "движок: out_user_nanoforge не создан"; exit 1; fi
          resources/engine/NanoDecompilerCLI test_jars/user_plugins/GlowCases-1.1.0.jar out_user_glowcases --no-legitimacy-check
          if [ ! -d "out_user_glowcases" ]; then echo "движок: out_user_glowcases не создан"; exit 1; fi
          resources/engine/NanoDecompilerCLI test_jars/user_plugins/NanoMarket-2.0.0.jar out_user_nanomarket --no-legitimacy-check
          if [ ! -d "out_user_nanomarket" ]; then echo "движок: out_user_nanomarket не создан"; exit 1; fi
          resources/engine/NanoDecompilerCLI test_jars/user_plugins/NanoCore.jar out_user_nanocore --no-legitimacy-check
          if [ ! -d "out_user_nanocore" ]; then echo "движок: out_user_nanocore не создан"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Подготовить хэш зависимостей
        shell: bash
        run: |
          node -e 'const p = require("./package.json"); console.log(JSON.stringify({d: p.dependencies, dd: p.devDependencies}))' > .deps-hash.json

      - name: Кэш node_modules (ускоряет CI - см. HANDOFF)
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('.deps-hash.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Кэш Electron и electron-builder (Linux)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: npm install
        run: npm install


      - name: Кэш Vite dist/ (фронтенд)
        uses: actions/cache@v4
        with:
          path: dist
          key: vite-dist-${{ hashFiles('src/**', 'index.html', 'vite.config.mts', 'tsconfig.json') }}
          restore-keys: |
            vite-dist-

      - name: Собрать Electron-инсталлятор (npm run dist)
        run: npm run dist

      - name: Найти собранный AppImage
        run: |
          FILE=$(find dist -maxdepth 1 -iname "*.AppImage" | head -1)
          if [ -z "$FILE" ]; then echo "Собранный .AppImage не найден - смотри логи electron-builder выше"; exit 1; fi
          cp "$FILE" "NanoDecompiler-Client.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: client-artifact-linux
          path: NanoDecompiler-Client.AppImage
          if-no-files-found: error

  build-client-macos:
    needs: [resolve-version, build-clapi-macos]
    if: always() && !cancelled() && needs.resolve-version.result == 'success' && needs.build-clapi-macos.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      API_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Скачать собранный движок ClApi (macOS)
        uses: actions/download-artifact@v4
        with:
          name: clapi-artifacts-macos
          path: resources/engine

      - name: Подготовить NanoDecompilerCLI и проверить целостность
        run: |
          if [ -f "resources/engine/NanoDecompilerClApi" ]; then
            mv "resources/engine/NanoDecompilerClApi" "resources/engine/NanoDecompilerCLI"
          fi
          if [ ! -f "resources/engine/NanoDecompilerCLI" ]; then
            echo "::error::NanoDecompilerCLI не найден после скачивания артефакта!"
            exit 1
          fi
          chmod +x resources/engine/NanoDecompilerCLI
          SIZE=$(wc -c < "resources/engine/NanoDecompilerCLI")
          echo "Размер бинарника: $SIZE байт"
          if [ "$SIZE" -lt 500000 ]; then
            echo "::error::Бинарник NanoDecompilerCLI подозрительно маленький (< 500KB)!"
            exit 1
          fi

      - name: Записать .engine-api-version (см. electron/updater.ts)
        working-directory: resources/engine
        run: printf '%s' "$API_VERSION" > .engine-api-version

      - name: Проверка - собранный движок реально работает (смоук-тест, флаги)
        run: |
          echo "=== 1. Проверка флага --check-update ==="
          resources/engine/NanoDecompilerCLI --check-update || true

          echo "=== 2. Смоук-тест ==="
          resources/engine/NanoDecompilerCLI test_jars/smoketest_plugin.jar out_check_client_cli --no-legitimacy-check
          if [ ! -d "out_check_client_cli" ]; then echo "движок: out_dir не создан - см. вывод выше"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Подготовить хэш зависимостей
        shell: bash
        run: |
          node -e 'const p = require("./package.json"); console.log(JSON.stringify({d: p.dependencies, dd: p.devDependencies}))' > .deps-hash.json

      - name: Кэш node_modules (ускоряет CI - см. HANDOFF)
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('.deps-hash.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Кэш Electron и electron-builder (macOS)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: npm install
        run: npm install

      - name: Собрать Electron-инсталлятор (npm run dist)
        # БЕЗ подписи (нет сертификата Apple Developer в секретах) -
        # electron-builder соберёт .dmg как есть, с предупреждением в логе.
        # Конечным пользователям придётся снять Gatekeeper-карантин вручную
        # (правый клик -> Открыть, или `xattr -cr NanoDecompiler.app`).
        run: npm run dist

      - name: Найти собранный dmg
        run: |
          FILE=$(find dist -maxdepth 1 -iname "*.dmg" | head -1)
          if [ -z "$FILE" ]; then echo "Собранный .dmg не найден - смотри логи electron-builder выше"; exit 1; fi
          cp "$FILE" "NanoDecompiler-Client.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: client-artifact-mac
          path: NanoDecompiler-Client.dmg
          if-no-files-found: error

  # HANDOFF_46: CLI и API уже слиты в ОДИН бинарник (cli_main.cpp
  # поддерживает обычный режим, --json-output И --api-server сразу). По
  # прямой просьбе пользователя объединено и на уровне релиза - один
  # артефакт "ClApi" на ОС (не два файла-дубликата под разными именами) -
  # 3 job'а, зеркально build-client-*, явно (не matrix), той же причине,
  # что и клиенты (HANDOFF_54 - видно, какая ОС упала).
  build-clapi-windows:
    needs: [resolve-version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Кэш cmake build/ (Windows) — пропускает компиляцию при неизменных исходниках
        uses: actions/cache@v4
        with:
          path: resources/engine_cpp/build
          key: ${{ runner.os }}-cmake-build-${{ hashFiles('resources/engine_cpp/src/**', 'resources/engine_cpp/include/**', 'resources/engine_cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-build-

      - name: Кэш ccache (Windows)
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('resources/engine_cpp/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-upx

      - name: Собрать движок (Windows)
        shell: msys2 {0}
        working-directory: resources/engine_cpp
        run: |
          export CCACHE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/.ccache"
          mkdir -p "$CCACHE_DIR"
          ccache -M 2G
          ccache -z
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          ninja -C build -j $(nproc)
          ccache -s --verbose
          strip -s build/NanoDecompilerCLI.exe
          upx --best build/NanoDecompilerCLI.exe || true
          cp build/NanoDecompilerCLI.exe ../../NanoDecompilerClApi.exe

      - name: Проверка - exe реально работает (обычный режим и --json-output)
        shell: pwsh
        working-directory: .
        run: |
          # Обычный режим — движок пишет прогресс + ##ND_RESULT:{}##, нас интересует exit code и наличие out_dir
          $consoleOut = .\NanoDecompilerClApi.exe test_jars\smoketest_plugin.jar out_check_cli --no-legitimacy-check 2>&1 | Out-String
          Write-Host "=== вывод движка (обычный режим) ==="
          Write-Host $consoleOut
          Write-Host "=== код выхода: $LASTEXITCODE ==="
          if (-not (Test-Path "out_check_cli")) { throw "ClApi: out_dir (обычный режим) не создан - см. вывод движка выше" }

          # --json-output: движок выводит ##ND_FILE:*## перед итоговым JSON — берём только строку с {
          $rawLines = .\NanoDecompilerClApi.exe test_jars\smoketest_plugin.jar out_check_cli_json --json-output --no-legitimacy-check 2>&1
          $jsonLine = ($rawLines | Where-Object { $_ -match '^\s*\{' }) -join ""
          if (-not $jsonLine) { throw "ClApi: --json-output не вернул JSON-строку. Вывод: $rawLines" }
          $json = $jsonLine | ConvertFrom-Json
          if ($json.status -ne "ok") { throw "ClApi: --json-output вернул status=$($json.status), reason=$($json.reason)" }

          $rawNeo = .\NanoDecompilerClApi.exe test_jars\NeoBuyer.jar out_check_cli_neobuyer --json-output --no-legitimacy-check 2>&1
          $jsonNeoLine = ($rawNeo | Where-Object { $_ -match '^\s*\{' }) -join ""
          if (-not $jsonNeoLine) { throw "ClApi: NeoBuyer --json-output не вернул JSON. Вывод: $rawNeo" }
          $jsonNeo = $jsonNeoLine | ConvertFrom-Json
          if ($jsonNeo.status -ne "ok") { throw "ClApi: NeoBuyer --json-output вернул status=$($jsonNeo.status), reason=$($jsonNeo.reason)" }

      - uses: actions/upload-artifact@v4
        with:
          name: clapi-artifacts-windows
          path: NanoDecompilerClApi.exe
          if-no-files-found: error

  build-clapi-linux:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Кэш cmake build/ (Linux) — пропускает компиляцию при неизменных исходниках
        uses: actions/cache@v4
        with:
          path: resources/engine_cpp/build
          key: ${{ runner.os }}-cmake-build-${{ hashFiles('resources/engine_cpp/src/**', 'resources/engine_cpp/include/**', 'resources/engine_cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-build-

      - name: Кэш ccache (Linux)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('resources/engine_cpp/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Кэш apt пакетов (Linux build tools)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-engine-build-tools-v1
          restore-keys: |
            ${{ runner.os }}-apt-engine-build-tools-

      - name: Установить зависимости сборки
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev ccache ninja-build upx-ucl

      - name: Собрать движок (Linux)
        working-directory: resources/engine_cpp
        run: |
          export CCACHE_DIR=~/.cache/ccache
          mkdir -p "$CCACHE_DIR"
          ccache -M 2G
          ccache -z
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          ninja -C build -j $(nproc)
          ccache -s --verbose
          strip --strip-all build/NanoDecompilerCLI
          upx --best build/NanoDecompilerCLI || true
          cp build/NanoDecompilerCLI ../../NanoDecompilerClApi

      - name: Проверка - бинарник реально работает
        run: |
          chmod +x NanoDecompilerClApi
          ./NanoDecompilerClApi test_jars/smoketest_plugin.jar out_check_cli --no-legitimacy-check
          test -d out_check_cli || { echo "ClApi: out_dir не создан - см. вывод движка выше"; exit 1; }
          JSON=$(./NanoDecompilerClApi test_jars/smoketest_plugin.jar out_check_cli_json --json-output --no-legitimacy-check)
          echo "$JSON" | grep -q '"status":"ok"' || { echo "ClApi: --json-output вернул: $JSON"; exit 1; }
          JSON_NEO=$(./NanoDecompilerClApi test_jars/NeoBuyer.jar out_check_cli_neobuyer --json-output --no-legitimacy-check)
          echo "$JSON_NEO" | grep -q '"status":"ok"' || { echo "ClApi Linux: NeoBuyer вернул: $JSON_NEO"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: clapi-artifacts-linux
          path: NanoDecompilerClApi
          if-no-files-found: error

  build-clapi-macos:
    needs: [resolve-version]
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Кэш cmake build/ (macOS) — пропускает компиляцию при неизменных исходниках
        uses: actions/cache@v4
        with:
          path: resources/engine_cpp/build
          key: ${{ runner.os }}-cmake-build-${{ hashFiles('resources/engine_cpp/src/**', 'resources/engine_cpp/include/**', 'resources/engine_cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-build-

      - name: Кэш ccache (macOS)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('resources/engine_cpp/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Установить ccache и ninja
        run: |
          brew install ninja || true
          brew install ccache || true

      - name: Собрать движок (macOS)
        working-directory: resources/engine_cpp
        run: |
          export CCACHE_DIR=~/Library/Caches/ccache
          mkdir -p "$CCACHE_DIR"
          ccache -M 2G
          ccache -z
          CMAKE_FLAGS="-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo"
          if command -v ccache >/dev/null 2>&1; then
            CMAKE_FLAGS="$CMAKE_FLAGS -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache"
          fi
          cmake $CMAKE_FLAGS
          ninja -C build -j $(sysctl -n hw.logicalcpu)
          ccache -s --verbose || true
          cp build/NanoDecompilerCLI ../../NanoDecompilerClApi

      - name: Проверка - бинарник реально работает
        run: |
          chmod +x NanoDecompilerClApi
          echo "=== 1. Смоук-тест ==="
          ./NanoDecompilerClApi test_jars/smoketest_plugin.jar out_check_cli --no-legitimacy-check
          test -d out_check_cli || { echo "ClApi: out_dir не создан - см. вывод движка выше"; exit 1; }
          JSON=$(./NanoDecompilerClApi test_jars/smoketest_plugin.jar out_check_cli_json --json-output --no-legitimacy-check)
          echo "$JSON" | grep -q '"status":"ok"' || { echo "ClApi: --json-output вернул: $JSON"; exit 1; }
          echo "=== 2. Декомпиляция NeoBuyer (обычный режим) ==="
          ./NanoDecompilerClApi test_jars/NeoBuyer.jar out_check_cli_neobuyer --no-legitimacy-check
          test -d out_check_cli_neobuyer || { echo "ClApi: out_check_cli_neobuyer не создан"; exit 1; }
          echo "=== 3. Декомпиляция NeoBuyer (--json-output) ==="
          JSON_NEO=$(./NanoDecompilerClApi test_jars/NeoBuyer.jar out_check_cli_neobuyer_json --json-output --no-legitimacy-check)
          echo "$JSON_NEO" | grep -q '"status":"ok"' || { echo "ClApi macOS: NeoBuyer вернул: $JSON_NEO"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: clapi-artifacts-macos
          path: NanoDecompilerClApi
          if-no-files-found: error

  build-lite-gui:
    needs: [resolve-version, build-clapi-windows, build-clapi-linux, build-clapi-macos]
    if: always() && !cancelled() && needs.resolve-version.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os_name: Windows
            arch_name: x64
            ext: .exe
            out_file: NanoDecompiler-Lite-Windows-x64
            clapi_artifact: clapi-artifacts-windows
            clapi_bin: NanoDecompilerClApi.exe
            embedded_name: NanoDecompilerCLI.exe
          - rid: linux-x64
            os_name: Linux
            arch_name: x64
            ext: ""
            out_file: NanoDecompiler-Lite-Linux-x64
            clapi_artifact: clapi-artifacts-linux
            clapi_bin: NanoDecompilerClApi
            embedded_name: NanoDecompilerCLI
          - rid: osx-x64
            os_name: macOS
            arch_name: x64
            ext: ""
            out_file: NanoDecompiler-Lite-macOS-x64
            clapi_artifact: clapi-artifacts-macos
            clapi_bin: NanoDecompilerClApi
            embedded_name: NanoDecompilerCLI
          - rid: osx-arm64
            os_name: macOS
            arch_name: arm64
            ext: ""
            out_file: NanoDecompiler-Lite-macOS-arm64
            clapi_artifact: clapi-artifacts-macos
            clapi_bin: NanoDecompilerClApi
            embedded_name: NanoDecompilerCLI
    steps:
      - uses: actions/checkout@v4
      - name: Скачать собранный нативный CLI движок
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.clapi_artifact }}
          path: clapi_temp
      - name: Встроить нативный движок в ресурсы NanoDecompilerLite
        id: embed_engine
        run: |
          if [ ! -f "clapi_temp/${{ matrix.clapi_bin }}" ]; then
            echo "::warning::Движок ${{ matrix.clapi_bin }} не найден для ${{ matrix.rid }} (раннер был в очереди или отменен). Пропуск сборки слайса."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p src_lite_cs/NanoDecompilerLite/Resources
          cp clapi_temp/${{ matrix.clapi_bin }} src_lite_cs/NanoDecompilerLite/Resources/${{ matrix.embedded_name }}
          chmod +x src_lite_cs/NanoDecompilerLite/Resources/${{ matrix.embedded_name }}
          echo "skip_build=false" >> "$GITHUB_OUTPUT"
      - name: Установка .NET 8 SDK
        if: steps.embed_engine.outputs.skip_build != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Кэш NuGet пакетов (.NET Avalonia)
        if: steps.embed_engine.outputs.skip_build != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src_lite_cs/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Сборка и публикация NanoDecompilerLite (${{ matrix.rid }})
        if: steps.embed_engine.outputs.skip_build != 'true'
        working-directory: src_lite_cs/NanoDecompilerLite
        run: |
          dotnet publish -c Release -r ${{ matrix.rid }} --self-contained false -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o out
          mv out/NanoDecompilerLite${{ matrix.ext }} "../../${{ matrix.out_file }}-${{ needs.resolve-version.outputs.version }}${{ matrix.ext }}"
      - name: Загрузка артефакта Lite
        if: steps.embed_engine.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lite-artifact-${{ matrix.rid }}
          path: ${{ matrix.out_file }}-${{ needs.resolve-version.outputs.version }}${{ matrix.ext }}
          if-no-files-found: ignore

  # =========================================================================
  # ОСНОВНОЙ КЛИЕНТ НОВОГО ПОКОЛЕНИЯ: TAURI V2 NATIVE (WINDOWS & LINUX)
  # =========================================================================
  build-tauri-windows:
    needs: [resolve-version, build-clapi-windows]
    runs-on: windows-latest
    env:
      API_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Скачать собранный движок ClApi (Windows)
        uses: actions/download-artifact@v4
        with:
          name: clapi-artifacts-windows
          path: resources/engine

      - name: Подготовить NanoDecompilerCLI.exe
        shell: bash
        run: |
          if [ -f "resources/engine/NanoDecompilerClApi.exe" ]; then
            mv "resources/engine/NanoDecompilerClApi.exe" "resources/engine/NanoDecompilerCLI.exe"
          fi
          if [ ! -f "resources/engine/NanoDecompilerCLI.exe" ]; then
            echo "::error::NanoDecompilerCLI.exe не найден!"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Подготовить хэш зависимостей
        shell: bash
        run: |
          node -e 'const p = require("./package.json"); console.log(JSON.stringify({d: p.dependencies, dd: p.devDependencies}))' > .deps-hash.json

      - name: Кэш node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('.deps-hash.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Установить Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш Rust Cargo (Tauri & FastScan)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tauri-v2/src-tauri
            crates/nanodecompiler-fastscan
          cache-targets: true
          cache-all-crates: true

      - name: npm install
        run: npm install


      - name: Кэш Vite dist/ (фронтенд — пропускает сборку при неизменном src/)
        uses: actions/cache@v4
        with:
          path: dist
          key: vite-dist-${{ hashFiles('src/**', 'index.html', 'vite.config.mts', 'tsconfig.json') }}
          restore-keys: |
            vite-dist-

      - name: Собрать фронтенд (Vite)
        run: npm run build:renderer

      - name: Собрать нативный бинарник Tauri v2
        shell: bash
        run: |
          cd tauri-v2/src-tauri
          cargo build --release
          cd ../..
          # find the exe regardless of subtle path differences
          STANDALONE=$(find tauri-v2/src-tauri/target/release -maxdepth 1 -iname 'nanodecompiler-tauri.exe' | head -1)
          if [ -z "$STANDALONE" ]; then
            echo '::error::nanodecompiler-tauri.exe not found after cargo build'
            find tauri-v2/src-tauri/target/release -maxdepth 1 -type f -name '*.exe' || true
            exit 1
          fi
          cp "$STANDALONE" NanoDecompiler-Tauri-Windows-x64-Standalone.exe

      - name: Собрать инсталлятор Tauri v2 (NSIS / Bundle)
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # Принудительно добавляем NSIS в PATH (choco кладёт его в Program Files (x86)/NSIS)
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          if ! command -v makensis &>/dev/null; then
            choco install nsis -y --no-progress
            export PATH="$PATH:/c/Program Files (x86)/NSIS"
          fi
          SETUP_CANDIDATE=''
          if [ -f 'resources/installer_tauri.nsi' ] && command -v makensis &>/dev/null; then
            (cd resources && makensis -DPRODUCT_VERSION="$VERSION" installer_tauri.nsi) || true
            SETUP_CANDIDATE=$(find . -maxdepth 1 -iname 'NanoDecompiler-Tauri-Setup-*.exe' 2>/dev/null | head -1)
          fi
          if [ -n "$SETUP_CANDIDATE" ]; then
            cp "$SETUP_CANDIDATE" NanoDecompiler-Tauri-Windows-x64-Setup.exe
          else
            cp NanoDecompiler-Tauri-Windows-x64-Standalone.exe NanoDecompiler-Tauri-Windows-x64-Setup.exe
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-artifact-win
          path: |
            NanoDecompiler-Tauri-Windows-x64-Setup.exe
            NanoDecompiler-Tauri-Windows-x64-Standalone.exe
          if-no-files-found: error

  build-tauri-linux:
    needs: [resolve-version, build-clapi-linux]
    runs-on: ubuntu-latest
    env:
      API_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Скачать собранный движок ClApi (Linux)
        uses: actions/download-artifact@v4
        with:
          name: clapi-artifacts-linux
          path: resources/engine

      - name: Подготовить NanoDecompilerCLI
        run: |
          if [ -f "resources/engine/NanoDecompilerClApi" ]; then
            mv "resources/engine/NanoDecompilerClApi" "resources/engine/NanoDecompilerCLI"
          fi
          chmod +x resources/engine/NanoDecompilerCLI

      - name: Установить зависимости Linux для Tauri v2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Подготовить хэш зависимостей
        run: |
          node -e 'const p = require("./package.json"); console.log(JSON.stringify({d: p.dependencies, dd: p.devDependencies}))' > .deps-hash.json

      - name: Кэш node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('.deps-hash.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Установить Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш Rust Cargo (Tauri & FastScan)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tauri-v2/src-tauri
            crates/nanodecompiler-fastscan
          cache-targets: true
          cache-all-crates: true

      - name: npm install
        run: npm install


      - name: Кэш Vite dist/ (фронтенд — пропускает сборку при неизменном src/)
        uses: actions/cache@v4
        with:
          path: dist
          key: vite-dist-${{ hashFiles('src/**', 'index.html', 'vite.config.mts', 'tsconfig.json') }}
          restore-keys: |
            vite-dist-

      - name: Собрать фронтенд (Vite)
        run: npm run build:renderer

      - name: Собрать бинарник Tauri v2 Linux
        run: |
          cd tauri-v2/src-tauri
          cargo build --release
          cd ../..
          cp tauri-v2/src-tauri/target/release/nanodecompiler-tauri NanoDecompiler-Tauri-Linux-x64
          chmod +x NanoDecompiler-Tauri-Linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-artifact-linux
          path: NanoDecompiler-Tauri-Linux-x64
          if-no-files-found: error

  build-android-native:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v4

      - name: Подготовить хэш зависимостей
        shell: bash
        run: |
          node -e 'const p = require("./package.json"); console.log(JSON.stringify({d: p.dependencies, dd: p.devDependencies}))' > .deps-hash.json

      - name: Кэш node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('.deps-hash.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: npm install & Сборка фронтенда (Vite)
        run: |
          npm install
          npm run build:renderer
          # Синхронизируем свежие ассеты в mobile-android/assets
          rm -rf mobile-android/assets/assets
          cp -r dist/assets mobile-android/assets/
          cp dist/index.html mobile-android/assets/

      - name: Скачать Kotlin Compiler и uber-apk-signer
        run: |
          wget -q https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q kotlin-compiler-1.9.22.zip
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Собрать нативный Android APK (2.97 MB)
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          fi
          python3 scripts/build_android.py --version "$RELEASE_TAG" --out-dir android-apk
          rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-artifact-android
          path: android-apk/NanoDecompiler-Android-arm64-*.apk
          if-no-files-found: error

  publish-release:
    permissions:
      contents: write
    # HANDOFF_54: явно перечислены ВСЕ клиентские, ClApi и Lite job'ы
    needs: [
      resolve-version,
      build-tauri-windows,
      build-tauri-linux,
      build-android-native,
      build-client-windows,
      build-client-linux,
      build-client-macos,
      build-clapi-windows,
      build-clapi-linux,
      build-clapi-macos,
      build-lite-gui
    ]
    if: always() && !cancelled() &&
        needs.resolve-version.result == 'success' &&
        needs.build-android-native.result == 'success' &&
        needs.build-tauri-windows.result == 'success' &&
        needs.build-client-windows.result == 'success' &&
        needs.build-clapi-windows.result == 'success'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.version }}
      CLIENT_VERSION: ${{ needs.resolve-version.outputs.version }}
      API_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: tauri-artifact-*
          path: release-files-tmp/tauri
          merge-multiple: true

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: client-artifact-*
          path: release-files-tmp/clients
          merge-multiple: true

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: lite-artifact-*
          path: release-files
          merge-multiple: true

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: clapi-artifacts-windows
          path: release-files-tmp/windows
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: clapi-artifacts-linux
          path: release-files-tmp/linux
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: clapi-artifacts-macos
          path: release-files-tmp/macos

      - name: Разложить бинарники по строгому стандарту [Name]-[OS]-[arch]-[version][ext]
        shell: bash
        run: |
          TAG="${RELEASE_TAG}"
          # 1. ОСНОВНЫЕ КЛИЕНТЫ: TAURI V2 NATIVE (НОВОЕ ПОКОЛЕНИЕ)
          if [ -f "release-files-tmp/tauri/NanoDecompiler-Tauri-Windows-x64-Setup.exe" ]; then
            mv release-files-tmp/tauri/NanoDecompiler-Tauri-Windows-x64-Setup.exe release-files/NanoDecompiler-Tauri-Windows-x64-${TAG}.exe
          fi
          if [ -f "release-files-tmp/tauri/NanoDecompiler-Tauri-Windows-x64-Standalone.exe" ]; then
            mv release-files-tmp/tauri/NanoDecompiler-Tauri-Windows-x64-Standalone.exe release-files/NanoDecompiler-Tauri-Windows-x64-${TAG}-Portable.exe
          fi
          if [ -f "release-files-tmp/tauri/NanoDecompiler-Tauri-Linux-x64" ]; then
            mv release-files-tmp/tauri/NanoDecompiler-Tauri-Linux-x64 release-files/NanoDecompiler-Tauri-Linux-x64-${TAG}
          fi
          if compgen -G "release-files-tmp/tauri/NanoDecompiler-Android-arm64-*.apk" > /dev/null; then
            cp release-files-tmp/tauri/NanoDecompiler-Android-arm64-*.apk release-files/NanoDecompiler-Android-arm64-${TAG}.apk
          elif [ -f "release-files-tmp/tauri/NanoDecompiler-Android-arm64.apk" ]; then
            mv release-files-tmp/tauri/NanoDecompiler-Android-arm64.apk release-files/NanoDecompiler-Android-arm64-${TAG}.apk
          fi

          # 2. КЛАССИЧЕСКИЕ КЛИЕНТЫ (ELECTRON GUI)
          if [ -f "release-files-tmp/clients/NanoDecompiler-Client-Setup.exe" ]; then
            mv release-files-tmp/clients/NanoDecompiler-Client-Setup.exe release-files/NanoDecompiler-Electron-Windows-x64-${TAG}.exe
          fi
          if [ -f "release-files-tmp/clients/NanoDecompiler-Client.AppImage" ]; then
            mv release-files-tmp/clients/NanoDecompiler-Client.AppImage release-files/NanoDecompiler-Electron-Linux-x64-${TAG}.AppImage
          fi
          if [ -f "release-files-tmp/clients/NanoDecompiler-Client.dmg" ]; then
            mv release-files-tmp/clients/NanoDecompiler-Client.dmg release-files/NanoDecompiler-Electron-macOS-arm64-${TAG}.dmg
          fi

          # 3. ДВИЖКИ CLI (C++ CLI)
          if [ -f "release-files-tmp/windows/NanoDecompilerClApi.exe" ]; then
            mv release-files-tmp/windows/NanoDecompilerClApi.exe release-files/NanoDecompiler-CLI-Windows-x64-${TAG}.exe
          fi
          if [ -f "release-files-tmp/linux/NanoDecompilerClApi" ]; then
            mv release-files-tmp/linux/NanoDecompilerClApi release-files/NanoDecompiler-CLI-Linux-x64-${TAG}
          fi
          if [ -f "release-files-tmp/macos/NanoDecompilerClApi" ]; then
            mv release-files-tmp/macos/NanoDecompilerClApi release-files/NanoDecompiler-CLI-macOS-arm64-${TAG}
          fi

      # Собрать ассеты и упаковать легковесные OTA-пакеты (.ndota)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Собрать фронтенд и Electron скрипты для OTA
        run: |
          npm install
          npm run build

      - name: Собрать легковесные OTA пакеты (.ndota)
        shell: bash
        run: |
          python3 scripts/package_ndota.py --tag "${RELEASE_TAG}" --release-dir release-files

      # Сгенерировать checksums.json (SHA256 всех артефактов)
      - name: Сгенерировать checksums.json и ota-manifest.json
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os
          from datetime import datetime, timezone

          # 1. Сгенерировать checksums.json
          checksums = {}
          for name in sorted(os.listdir("release-files")):
              if name in ("versions.json", "checksums.json", "ota-manifest.json"):
                  continue
              path = os.path.join("release-files", name)
              if not os.path.isfile(path):
                  continue
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              checksums[name] = h.hexdigest()

          with open("release-files/checksums.json", "w", encoding="utf-8") as f:
              json.dump(checksums, f, indent=2)
          print("Сгенерирован checksums.json")

          # 2. Сгенерировать ota-manifest.json для всех экосистемных компонентов
          tag = os.environ.get("RELEASE_TAG", "v2.0.6")
          ver = tag.lstrip("v")
          repo = os.environ.get("GITHUB_REPOSITORY", "nanodevmc/NanoDecompiler")

          def make_entry(filename):
              if not filename or filename not in checksums:
                  return None
              p = os.path.join("release-files", filename)
              size = os.path.getsize(p) if os.path.exists(p) else 0
              return {
                  "name": filename,
                  "version": ver,
                  "sha256": checksums[filename],
                  "sizeBytes": size,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{filename}"
              }

          manifest = {
              "manifestVersion": ver,
              "releaseTag": tag,
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "channels": ["stable", "beta", "nightly"],
              "checksums": checksums,
              "components": {
                  "engine": {
                      "windows_x64": make_entry(f"NanoDecompiler-CLI-Windows-x64-{tag}.exe"),
                      "linux_x64": make_entry(f"NanoDecompiler-CLI-Linux-x64-{tag}"),
                      "macos_arm64": make_entry(f"NanoDecompiler-CLI-macOS-arm64-{tag}"),
                  },
                  "desktop_tauri": {
                      "windows_setup": make_entry(f"NanoDecompiler-Tauri-Windows-x64-{tag}.exe"),
                      "windows_portable": make_entry(f"NanoDecompiler-Tauri-Windows-x64-{tag}-Portable.exe"),
                      "linux_x64": make_entry(f"NanoDecompiler-Tauri-Linux-x64-{tag}"),
                  },
                  "desktop_electron": {
                      "windows_setup": make_entry(f"NanoDecompiler-Electron-Windows-x64-{tag}.exe"),
                      "linux_appimage": make_entry(f"NanoDecompiler-Electron-Linux-x64-{tag}.AppImage"),
                      "macos_dmg": make_entry(f"NanoDecompiler-Electron-macOS-arm64-{tag}.dmg"),
                  },
                  "desktop_lite": {
                      "windows_x64": make_entry(f"NanoDecompiler-Lite-Windows-x64-{tag}.exe"),
                      "linux_x64": make_entry(f"NanoDecompiler-Lite-Linux-x64-{tag}"),
                      "macos_x64": make_entry(f"NanoDecompiler-Lite-macOS-x64-{tag}"),
                      "macos_arm64": make_entry(f"NanoDecompiler-Lite-macOS-arm64-{tag}"),
                  },
                  "mobile_android": {
                      "arm64_apk": make_entry(f"NanoDecompiler-Android-arm64-{tag}.apk"),
                  }
              },
              "otaPackages": {
                  "gui_webui": make_entry(f"NanoDecompiler-OTA-WebUI-{tag}.ndota"),
                  "gui_electron": make_entry(f"NanoDecompiler-OTA-Electron-{tag}.ndota"),
                  "gui_android": make_entry(f"NanoDecompiler-OTA-Android-{tag}.ndota"),
                  "gui_lite": make_entry(f"NanoDecompiler-OTA-Lite-{tag}.ndota")
              }
          }

          with open("release-files/ota-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print("Сгенерирован ota-manifest.json:")
          print(json.dumps(manifest, indent=2))
          PYEOF

      - name: Подготовить release_notes.md из CHANGELOG.md
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import os, re
          tag = os.environ.get("RELEASE_TAG", "").strip().lstrip("v")
          changelog_section = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
              pattern = rf"##\s*\[?{re.escape(tag)}\]?[^\n]*\n(.*?)(?=\n##\s|\Z)"
              m = re.search(pattern, content, re.DOTALL)
              if m:
                  changelog_section = m.group(1).strip()
          
          if not changelog_section:
              changelog_section = f"Сборка от коммита {os.environ.get('GITHUB_SHA', '')}."
          
          tag_full = os.environ.get('RELEASE_TAG', 'v' + tag)

          all_catalog = [
              (f"NanoDecompiler-Tauri-Windows-x64-{tag_full}.exe", "**Tauri (Desktop)**", "⭐ **Основной клиент** (Installer, Liquid Glass + MD3)"),
              (f"NanoDecompiler-Tauri-Windows-x64-{tag_full}-Portable.exe", "**Tauri (Desktop)**", "Нативный портативный клиент (без инсталляции)"),
              (f"NanoDecompiler-Tauri-Linux-x64-{tag_full}", "**Tauri (Desktop)**", "⭐ **Основной клиент для Linux**"),
              (f"NanoDecompiler-Electron-Windows-x64-{tag_full}.exe", "**Electron (Desktop)**", "Классический GUI инсталлятор (Fallback)"),
              (f"NanoDecompiler-Electron-Linux-x64-{tag_full}.AppImage", "**Electron (Desktop)**", "Классический GUI AppImage"),
              (f"NanoDecompiler-Electron-macOS-arm64-{tag_full}.dmg", "**Electron (Desktop)**", "Классический GUI DMG для Apple Silicon"),
              (f"NanoDecompiler-Lite-Windows-x64-{tag_full}.exe", "**Lite (Avalonia)**", "Ультралегкий C# GUI клиент (мгновенный запуск)"),
              (f"NanoDecompiler-Lite-Linux-x64-{tag_full}", "**Lite (Avalonia)**", "Ультралегкий C# GUI клиент для Linux"),
              (f"NanoDecompiler-Lite-macOS-x64-{tag_full}", "**Lite (Avalonia)**", "Ультралегкий C# GUI клиент для macOS Intel"),
              (f"NanoDecompiler-Lite-macOS-arm64-{tag_full}", "**Lite (Avalonia)**", "Ультралегкий C# GUI клиент для Apple Silicon"),
              (f"NanoDecompiler-CLI-Windows-x64-{tag_full}.exe", "**CLI / Core**", "C++ Движок декомпиляции и CLI/API сервер"),
              (f"NanoDecompiler-CLI-Linux-x64-{tag_full}", "**CLI / Core**", "C++ Движок декомпиляции (Linux)"),
              (f"NanoDecompiler-CLI-macOS-arm64-{tag_full}", "**CLI / Core**", "C++ Движок декомпиляции (macOS ARM64)"),
              (f"NanoDecompiler-Android-arm64-{tag_full}.apk", "**Android (Mobile)**", "⭐ **Нативный мобильный APK** (Kotlin + FastScan)"),
              (f"NanoDecompiler-OTA-WebUI-{tag_full}.ndota", "**OTA / Delta**", "Легковесный OTA архив WebUI компонентов"),
              (f"NanoDecompiler-OTA-Electron-{tag_full}.ndota", "**OTA / Delta**", "Легковесный OTA архив Electron Renderer"),
              (f"NanoDecompiler-OTA-Android-{tag_full}.ndota", "**OTA / Delta**", "Легковесный OTA архив мобильного UI"),
              (f"NanoDecompiler-OTA-Lite-{tag_full}.ndota", "**OTA / Delta**", "Легковесный OTA архив тем и ассетов Lite GUI"),
              ("ota-manifest.json", "**Metadata**", "Манифест спецификации всех OTA пакетов и бинарников"),
              ("checksums.json", "**Metadata**", "Контрольные суммы SHA256 всех релизных файлов"),
          ]

          table_rows = []
          for fname, plat, desc in all_catalog:
              fpath = os.path.join("release-files", fname)
              if os.path.exists(fpath):
                  sz = os.path.getsize(fpath)
                  mb = sz / (1024 * 1024)
                  kb = sz / 1024
                  sz_str = f"**{mb:.2f} MB**" if mb >= 1.0 else f"**{kb:.1f} KB**"
                  table_rows.append(f"| `{fname}` | {plat} | {desc} | {sz_str} |")

          lines = [
              f"## 🚀 NanoDecompiler {tag_full}",
              "",
              "### 📋 Список изменений",
              changelog_section,
              "",
              "### 📦 Загрузки (Стандартизированные артефакты [Name]-[Platform]-[OS]-[Arch]-[Version][Ext])",
              "",
              "| Файл | Платформа | Описание | Размер |",
              "|------|-----------|----------|--------|",
          ] + table_rows + [
              "",
              "### Как проверялось",
              "Все сборки компилируются и верифицируются в CI матрице на реальных тестах декомпиляции.",
          ]
          body = "\n".join(lines)
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(body)
          print("Сгенерировано описание релиза:")
          print(body)
          PYEOF

      - name: Публикация ОДНОГО релиза со всеми файлами и текстом
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "NanoDecompiler ${{ env.RELEASE_TAG }}"
          files: release-files/*
          body_path: release_notes.md
          prerelease: ${{ contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') }}
