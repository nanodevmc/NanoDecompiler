[package]
name = "nanodecompiler-tauri"
version = "2.0.8"
description = "NanoDecompiler Native Desktop App (Tauri v2 Edition)"
authors = ["NanoDev"]
edition = "2021"

[lib]
name = "nanodecompiler_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nanodecompiler-fastscan = { path = "../../crates/nanodecompiler-fastscan" }
open = "5.3"
walkdir = "2.5"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
sha2 = "0.10"
